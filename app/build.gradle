plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'app.chainling'
 compileSdk 35
 defaultConfig { applicationId 'app.chainling'; minSdk 26; targetSdk 35; versionCode 19; versionName '0.4.1' }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs { debug { storeFile file('../cache/chainling-debug.keystore') } }
}
dependencies {
 implementation 'androidx.activity:activity-ktx:1.10.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
 implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.7'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
 implementation 'androidx.core:core-ktx:1.15.0'
 testImplementation 'junit:junit:4.13.2'
}
dependencies { testImplementation 'org.json:json:20240303' }

tasks.withType(Test).configureEach { maxHeapSize = '128m'; jvmArgs '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1' }













